# Конфигурация только через переменные окружения (ARCH-05). Валидация — AppProperties (@Validated).
server:
  port: 8080
  shutdown: graceful
  # native = Tomcat RemoteIpValve: подставляет IP клиента из X-Forwarded-For (доверяя только
  # внутренним прокси — docker-сети 172.16/12, 10/8, 127/8) и схему из X-Forwarded-Proto.
  # framework (ForwardedHeaderFilter) X-Forwarded-For НЕ трогает — за прокси все запросы
  # выглядели бы одним IP, и rate-limit/троттлинг входа били бы по всем пользователям сразу.
  forward-headers-strategy: native
  error:
    include-stacktrace: never
    include-message: never

spring:
  application:
    name: core-api
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:tutorcraft}
    username: ${POSTGRES_USER:tutorcraft}
    password: ${POSTGRES_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
  flyway:
    locations: classpath:db/migration
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/tutorcraft}
      auto-index-creation: false
      uuid-representation: standard
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:29092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: core-api
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      ack-mode: record
  jackson:
    default-property-inclusion: always
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,db,mongo,redis
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:0.1}

springdoc:
  api-docs:
    path: /api/v1/openapi.json
  swagger-ui:
    path: /api/docs

tutorcraft:
  web-origin: ${WEB_ORIGIN:http://localhost:3000}
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:3000}
  security:
    jwt-secret: ${JWT_SECRET:}
    access-token-ttl: PT15M
    refresh-token-ttl: P30D
    cookie-secure: ${COOKIE_SECURE:true}
    data-encryption-key: ${DATA_ENCRYPTION_KEY:}
    login-max-attempts-per-account: 5
    login-max-attempts-per-ip: 30
    login-window: PT15M
    password-reset-ttl: PT1H
    invitation-ttl: P7D
  oauth:
    google-client-id: ${GOOGLE_CLIENT_ID:}
    telegram-bot-token: ${TELEGRAM_BOT_TOKEN:}
    telegram-bot-username: ${TELEGRAM_BOT_USERNAME:}
    telegram-auth-max-age: P1D
  storage:
    # local — файлы на диске сервера (временно, пока не подключено S3); s3 — S3-совместимое хранилище.
    driver: ${STORAGE_DRIVER:local}
    # Каталог для driver=local. В контейнерах — общий volume с media-worker (он пишет туда HLS).
    local-root: ${STORAGE_LOCAL_ROOT:./data/files}
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    public-endpoint: ${S3_PUBLIC_ENDPOINT:http://localhost:9000}
    region: ${S3_REGION:us-east-1}
    bucket: ${S3_BUCKET:tutorcraft}
    access-key: ${S3_ACCESS_KEY:}
    secret-key: ${S3_SECRET_KEY:}
    upload-url-ttl: PT15M
    download-url-ttl: PT10M
    max-file-size-bytes: 2147483648
  kafka:
    topic-prefix: ${KAFKA_TOPIC_PREFIX:tc}
    outbox-batch-size: 100
    outbox-poll-interval: PT0.5S
  # Журнал активности (админка → «Активность»): каждый запрос к API, переходы и ошибки в браузере.
  activity-log:
    enabled: ${ACTIVITY_LOG_ENABLED:true}
    # false — успешные GET не пишутся (меньше объём), изменения и любые ошибки пишутся всегда.
    log-reads: ${ACTIVITY_LOG_READS:true}
    retention: ${ACTIVITY_LOG_RETENTION:P30D}
    queue-capacity: 10000
    batch-size: 500
    flush-interval: PT1S
    purge-cron: "0 37 3 * * *"
    max-stack-length: 8000
    trail-before: PT30M
    trail-after: PT5M
    trail-limit: 300
  rate-limit:
    requests-per-minute-user: 600
    requests-per-minute-ip: 300
  payments:
    provider: ${PAYMENT_PROVIDER:fake}
  quiz:
    time-grace: PT5S
  trash:
    retention: P30D
  seed:
    enabled: ${SEED_DEMO_DATA:false}
    demo-password: ${SEED_DEMO_PASSWORD:}
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
    first-name: ${ADMIN_FIRST_NAME:Главный}
    last-name: ${ADMIN_LAST_NAME:администратор}
  # Исходящие вебхуки (integrations): не входят в AppProperties, читаются через @Value с умолчаниями.
  webhooks:
    poll-interval: PT5S
    allow-localhost: false
  # Курсы (courses): не входят в AppProperties, читаются через @Value с умолчаниями.
  courses:
    public-catalog-ttl: PT60S
    trash-purge-cron: "0 17 3 * * *"
