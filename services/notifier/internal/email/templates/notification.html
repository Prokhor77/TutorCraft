<!DOCTYPE html>
<html lang="{{.Lang}}" xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="x-apple-disable-message-reformatting">
<meta name="color-scheme" content="light">
<meta name="supported-color-schemes" content="light">
<title>{{.Title}}</title>
</head>
<body style="margin:0;padding:0;background-color:#f1f1fb;-webkit-text-size-adjust:100%;">
<div style="display:none;max-height:0;overflow:hidden;opacity:0;mso-hide:all;">{{.Preheader}}</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f1f1fb;">
<tr><td align="center" style="padding:32px 12px;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:560px;">
<tr><td style="padding:0 8px 20px;">
<table role="presentation" cellpadding="0" cellspacing="0" border="0"><tr>
<td width="36" height="36" align="center" valign="middle" style="width:36px;height:36px;background-color:#4648d4;border-radius:10px;color:#ffffff;font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:bold;line-height:36px;">T</td>
<td style="padding-left:10px;font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:bold;color:#1b1b3a;">{{.Labels.Brand}}</td>
</tr></table>
</td></tr>
<tr><td style="background-color:#ffffff;border-radius:20px;padding:36px 32px;border:1px solid #e3e3f3;">
<h1 style="margin:0 0 20px;font-family:Arial,Helvetica,sans-serif;font-size:24px;line-height:1.3;font-weight:bold;color:#1b1b3a;">{{.Title}}</h1>
{{range .Paragraphs}}<p style="margin:0 0 14px;font-family:Arial,Helvetica,sans-serif;font-size:16px;line-height:1.6;color:#3d3d5c;">{{.}}</p>
{{end}}{{if .Link}}<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:28px 0 8px;"><tr>
<td align="center" bgcolor="#4648d4" style="border-radius:12px;background-color:#4648d4;">
<a href="{{.Link}}" target="_blank" style="display:inline-block;padding:15px 32px;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:bold;line-height:1.2;color:#ffffff;text-decoration:none;border-radius:12px;">{{.Action}}</a>
</td></tr></table>
<p style="margin:24px 0 6px;font-family:Arial,Helvetica,sans-serif;font-size:13px;line-height:1.5;color:#6b6b85;">{{.Labels.LinkHint}}</p>
<p style="margin:0;font-family:Arial,Helvetica,sans-serif;font-size:13px;line-height:1.5;word-break:break-all;"><a href="{{.Link}}" target="_blank" style="color:#4648d4;text-decoration:underline;">{{.Link}}</a></p>
{{end}}</td></tr>
<tr><td style="padding:20px 16px 0;font-family:Arial,Helvetica,sans-serif;font-size:12px;line-height:1.5;color:#8a8aa3;text-align:center;">{{.Footer}}</td></tr>
</table>
</td></tr>
</table>
</body>
</html>
