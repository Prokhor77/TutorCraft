# Оверлей к docker-compose.prod.yml для развёртывания по голому IP без внешнего S3.
#
#   docker compose -f docker-compose.prod.yml -f docker-compose.ip.yml up -d
#
# Зачем он нужен, если «S3 пока не используем»: AppProperties.Storage помечен @NotBlank по
# endpoint/bucket/accessKey/secretKey, и core-api просто не стартует с пустыми значениями
# (ARCH-05: невалидная конфигурация останавливает старт). Поэтому поднимаем локальный
# SeaweedFS — тот же, что в dev. Переезд на Yandex Object Storage / R2 позже = убрать этот
# оверлей и заполнить четыре переменные S3_* в .env.
#
# Наружу SeaweedFS не публикуется: контейнер слушает 127.0.0.1:9100, а на 0.0.0.0:9000 стоит
# nginx (infra/deploy/nginx/tutorcraft-ip.conf) — так порт остаётся под контролем UFW, который
# публикация порта докером в обход цепочки DOCKER-USER просто обошла бы.
#
# Якоря (*hardening, *logging, *hc) здесь НЕ используются намеренно: YAML-алиасы действуют в
# пределах одного файла, а compose объединяет файлы уже после разбора — ссылка на якорь из
# docker-compose.prod.yml развалила бы парсинг. Значения продублированы явно.

services:
  s3:
    image: chrislusf/seaweedfs:3.80
    container_name: tutorcraft_s3
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "3" }
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
    entrypoint: ["/bin/sh", "/s3-start.sh"]
    volumes:
      - "./infra/s3/start-prod.sh:/s3-start.sh:ro"
      - s3-data:/data
    ports:
      - "127.0.0.1:9100:8333"
    networks: [tutorcraft_net]
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }
    healthcheck:
      interval: 10s
      timeout: 5s
      retries: 30
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9333/cluster/status >/dev/null"]

  s3-init:
    image: chrislusf/seaweedfs:3.80
    container_name: tutorcraft_s3_init
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "3" }
    depends_on: { s3: { condition: service_healthy } }
    environment:
      S3_BUCKET: ${S3_BUCKET}
    volumes: ["./infra/s3/init.sh:/init.sh:ro"]
    entrypoint: ["/bin/sh", "/init.sh"]
    networks: [tutorcraft_net]
    restart: "no"

  # core-api и media-worker ходят в бакет по внутреннему адресу, браузер — по внешнему
  # (S3_PUBLIC_ENDPOINT из .env), поэтому endpoint'ы разные.
  core-api:
    environment:
      S3_ENDPOINT: http://s3:8333
    depends_on:
      s3-init: { condition: service_completed_successfully }

  media-worker:
    environment:
      S3_ENDPOINT: http://s3:8333
    depends_on:
      s3-init: { condition: service_completed_successfully }
    deploy:
      resources:
        limits: { cpus: "1.5", memory: 768M, pids: 256 }

  # --- Лимиты под конкретный сервер 91.149.179.186 -------------------------------------------
  # Замер 2026-09-28: 7.9 ГБ всего, 4.6 ГБ available, swap = 0, и на хосте ДВА соседа
  # (confeek/spruzhuk_* и crm-crm-1). Базовые лимиты docker-compose.prod.yml дают потолок
  # ≈6.7 ГБ — при пике это гарантированный OOM, причём killer выбирает жертву по объёму
  # памяти, а не по владельцу, так что упасть мог бы и сосед.
  #
  # Урезано до ≈5.1 ГБ потолка при ~2.5 ГБ в покое. Лимит — это потолок, а не резерв,
  # поэтому запас остаётся. Swap на 4 ГБ всё равно обязателен, см. docs/deployment-ip.md §3.1.
  #
  # Если появится свободная RAM — поднимать в первую очередь core-api (вместе с -Xmx в
  # entrypoint) и media-worker: транскодирование упирается в память раньше остального.
  postgres:
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }

  mongo:
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }

  kafka:
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 768M }

volumes:
  s3-data:
