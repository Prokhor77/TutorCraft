# CI (ТЗ, этап 0): линтеры, типы, тесты, сборка, OpenAPI, сканирование зависимостей и секретов.
name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  core-api:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: services/core-api } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - name: Unit + architecture tests
        run: mvn -B verify -DskipITs
      - name: Integration tests (Testcontainers)
        run: mvn -B failsafe:integration-test failsafe:verify
      - name: Dependency vulnerability scan (NFR-SEC-10)
        uses: aquasecurity/trivy-action@0.28.0
        with: { scan-type: fs, scan-ref: services/core-api, severity: 'HIGH,CRITICAL', exit-code: '1', ignore-unfixed: true }

  go-workers:
    runs-on: ubuntu-latest
    strategy:
      matrix: { module: [workerkit, media-worker, notifier] }
    # Блочный стиль обязателен: `${{` внутри inline-объекта `{ ... }` ломает YAML
    # (GitHub отклоняет весь файл как Invalid workflow file).
    defaults:
      run:
        working-directory: services/${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.24' }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: go vet ./...
      - run: go test -race ./...
      - uses: golang/govulncheck-action@v1
        with:
          work-dir: services/${{ matrix.module }}
          go-version-input: '1.24'

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run i18n:check
      - run: npm run contrast:check
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high --omit=dev

  e2e:
    runs-on: ubuntu-latest
    needs: [core-api, go-workers, web]
    steps:
      - uses: actions/checkout@v4
      - name: Start stack
        run: |
          ./scripts/init-env.sh
          docker compose up -d --build --wait
      - name: OpenAPI spec is up to date (API-02)
        run: |
          curl -sf http://localhost:8080/api/v1/openapi.json | python3 -m json.tool --sort-keys > /tmp/openapi.json
          python3 -m json.tool --sort-keys docs/api/openapi.json > /tmp/committed.json
          diff -u /tmp/committed.json /tmp/openapi.json
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - working-directory: apps/web
        run: npm ci && npx playwright install --with-deps chromium && npm run test:e2e
      - if: failure()
        run: docker compose logs --no-color > compose.log
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: compose-logs, path: compose.log }
