# CI (ТЗ, этап 0): линтеры, типы, тесты, сборка, OpenAPI, сканирование зависимостей и секретов.
name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  core-api:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: services/core-api } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - name: Unit + architecture tests
        run: mvn -B verify -DskipITs
      - name: Integration tests (Testcontainers)
        run: mvn -B failsafe:integration-test failsafe:verify
      - name: Dependency vulnerability scan (NFR-SEC-10)
        # Теги этого action идут с префиксом v (v0.28.0, v0.33.1, …). Без него job падал
        # за 2 секунды на разрешении action, так и не дойдя до Maven.
        uses: aquasecurity/trivy-action@v0.33.1
        with: { scan-type: fs, scan-ref: services/core-api, severity: 'HIGH,CRITICAL', exit-code: '1', ignore-unfixed: true }

  go-workers:
    runs-on: ubuntu-latest
    strategy:
      matrix: { module: [workerkit, media-worker, notifier] }
    # Блочный стиль обязателен: `${{` внутри inline-объекта `{ ... }` ломает YAML
    # (GitHub отклоняет весь файл как Invalid workflow file).
    defaults:
      run:
        working-directory: services/${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        # 1.27, а не 1.24: ветка 1.24 вышла из поддержки и не получает патчей stdlib.
        # На последней 1.24.13 govulncheck находит 10 уязвимостей со статусом
        # «Fixed in go1.25.x» — в 1.24 их не бэкпортируют, и job падал бы при любом коде.
        # Директива `go 1.24` в go.mod оставлена: это нижняя планка языка, не тулчейн.
        with: { go-version: '1.27' }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: go vet ./...
      - run: go test -race ./...
      - uses: golang/govulncheck-action@v1
        with:
          work-dir: services/${{ matrix.module }}
          go-version-input: '1.27'

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run i18n:check
      - run: npm run contrast:check
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high --omit=dev

# Job e2e перенесён в .github/workflows/e2e.yml.
#
# Причина: deploy-production.yml стартует по `workflow_run` успешного `ci`, а e2e поднимает
# весь compose-стек и гоняет Playwright — при каждом мигании он блокировал бы деплой уже
# проверенного кода. Плюс шаг сверки OpenAPI сравнивался с docs/api/openapi.json, которого
# в репозитории нет, из-за чего `ci` не мог стать зелёным в принципе.
#
# e2e остаётся обязательным перед релизом, просто запускается своим расписанием и вручную.
