# CI (ТЗ, этап 0): линтеры, типы, тесты, сборка, OpenAPI, сканирование зависимостей и секретов.
name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  core-api:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: services/core-api } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - name: Unit + architecture tests
        run: mvn -B verify -DskipITs
      # Интеграционные тесты (Testcontainers) перенесены в .github/workflows/integration.yml —
      # по той же причине, что и e2e: они поднимают Postgres/Mongo/Redis/Kafka в контейнерах,
      # зависят от версии докера на раннере и не должны блокировать выкладку проверенного кода.
      # Официальный образ вместо aquasecurity/trivy-action.
      #
      # История: у action теги идут с префиксом v, и `@0.28.0` без него ронял весь job за 2
      # секунды на этапе разрешения action — Maven не запускался ни разу. После `@v0.33.1`
      # шаг дошёл до дела и упал уже внутри: вложенный setup-trivy нашёл релиз v0.65.0, но не
      # смог поставить бинарник (он тянет его через GitHub API, где раннеры упираются в лимит).
      #
      # Образ с ghcr.io убирает обе точки отказа: ни разрешения action, ни скачивания релиза
      # через GitHub API. ghcr, а не Docker Hub — там лимит на анонимные pull'ы с общих
      # IP раннеров жёстче.
      #
      # Версия закреплена: плавающий latest менял бы результат сканирования без единого
      # изменения в коде, и CI однажды покраснел бы сам по себе. На актуальность проверки
      # это не влияет — базу уязвимостей trivy скачивает свежую при каждом запуске,
      # закреплён только сам сканер. Поднимать версию образа — отдельное осознанное
      # действие: новый сканер может найти больше, и это нужно чинить, а не ловить внезапно.
      - name: Dependency vulnerability scan (NFR-SEC-10)
        run: |
          docker run --rm -v "$PWD:/scan" -w /scan ghcr.io/aquasecurity/trivy:0.65.0 \
            fs --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 .

  go-workers:
    runs-on: ubuntu-latest
    strategy:
      matrix: { module: [workerkit, media-worker, notifier] }
    # Блочный стиль обязателен: `${{` внутри inline-объекта `{ ... }` ломает YAML
    # (GitHub отклоняет весь файл как Invalid workflow file).
    defaults:
      run:
        working-directory: services/${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        # 1.27, а не 1.24: ветка 1.24 вышла из поддержки и не получает патчей stdlib.
        # На последней 1.24.13 govulncheck находит 10 уязвимостей со статусом
        # «Fixed in go1.25.x» — в 1.24 их не бэкпортируют, и job падал бы при любом коде.
        # Директива `go 1.24` в go.mod оставлена: это нижняя планка языка, не тулчейн.
        with: { go-version: '1.27' }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: go vet ./...
      - run: go test -race ./...
      - uses: golang/govulncheck-action@v1
        with:
          work-dir: services/${{ matrix.module }}
          go-version-input: '1.27'

  # Прод-манифесты k3s (ADR-013): ошибка в YAML должна краснеть в PR, а не на шаге деплоя.
  k8s-manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
        with: { version: v1.36.1 }
      # Версия kubeconform закреплена по той же причине, что и trivy выше.
      - name: Render and validate
        run: |
          infra/k8s/render.sh > /tmp/tutorcraft.yaml
          docker run --rm -v "$PWD/infra/k8s/cluster:/cluster:ro" ghcr.io/yannh/kubeconform:v0.6.7 -strict -summary /cluster
          docker run --rm -i ghcr.io/yannh/kubeconform:v0.6.7 -strict -summary - < /tmp/tutorcraft.yaml

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run i18n:check
      - run: npm run contrast:check
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high --omit=dev

# Job e2e перенесён в .github/workflows/e2e.yml.
#
# Причина: deploy-production.yml стартует по `workflow_run` успешного `ci`, а e2e поднимает
# весь compose-стек и гоняет Playwright — при каждом мигании он блокировал бы деплой уже
# проверенного кода. Плюс шаг сверки OpenAPI сравнивался с docs/api/openapi.json, которого
# в репозитории нет, из-за чего `ci` не мог стать зелёным в принципе.
#
# e2e остаётся обязательным перед релизом, просто запускается своим расписанием и вручную.
