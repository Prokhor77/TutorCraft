name: Deploy to Production

# Запускается после успешного ci.yml на main (образы собираются из проверенного коммита),
# либо вручную. Собираем все четыре образа всегда: с кэшем слоёв неизменённые собираются за
# секунды, а paths-filter поверх workflow_run — лишняя точка отказа.
#
# Выкладка в k3s на том же сервере (ADR-013): манифесты рендерятся и проверяются на раннере,
# на сервер едет один YAML, его применяет infra/k8s/apply.sh под ServiceAccount с правами только
# на namespace tutorcraft.
#
# Секреты репозитория:  PROD_HOST, PROD_USER, PROD_SSH_KEY, PROD_PATH (например /opt/tutorcraft),
#                       GHCR_PULL_USER, GHCR_PULL_TOKEN (PAT с правом read:packages — из него
#                       apply.sh собирает imagePullSecret ghcr).
# Переменные (vars):    PROD_WS_URL — адрес WebSocket для браузера, вшивается в бандл при сборке web.
#                       Текущий деплой (голый IP, HTTP):  ws://91.149.179.186/ws
#                       При переезде на домен с TLS:      wss://<домен>/ws
#                       Схема обязана совпадать со схемой страницы: браузер не откроет ws://
#                       со страницы https:// (mixed content), и наоборот wss:// требует сертификата.
#
#                       PROD_S3_ORIGIN — origin S3-шлюза, куда браузер льёт файлы напрямую.
#                       Текущий деплой: http://91.149.179.186:9000
#                       Попадает в CSP connect-src; при пустом значении загрузка файлов
#                       будет блокироваться браузером с ошибкой Content-Security-Policy.

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: "What to do"
        required: true
        default: "all"
        type: choice
        options: [all, deploy-only]

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    outputs:
      ref: ${{ steps.pick.outputs.ref }}
      build: ${{ steps.pick.outputs.build }}
    steps:
      - id: pick
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "ref=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ github.sha }}" >> "$GITHUB_OUTPUT"
            [ "${{ inputs.target }}" = "deploy-only" ] && echo "build=false" >> "$GITHUB_OUTPUT" || echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  web:
    needs: gate
    if: needs.gate.outputs.build == 'true'
    uses: ./.github/workflows/_build-image.yml
    with:
      image: web
      context: ./apps/web
      ref: ${{ needs.gate.outputs.ref }}
      build_args: |
        NEXT_PUBLIC_WS_URL=${{ vars.PROD_WS_URL }}
        NEXT_PUBLIC_S3_ORIGIN=${{ vars.PROD_S3_ORIGIN }}

  core-api:
    needs: gate
    if: needs.gate.outputs.build == 'true'
    uses: ./.github/workflows/_build-image.yml
    with:
      image: core-api
      context: ./services/core-api
      ref: ${{ needs.gate.outputs.ref }}

  media-worker:
    needs: gate
    if: needs.gate.outputs.build == 'true'
    uses: ./.github/workflows/_build-image.yml
    with:
      image: media-worker
      # Контекст ./services: воркеры делят services/workerkit.
      context: ./services
      dockerfile: services/media-worker/Dockerfile
      ref: ${{ needs.gate.outputs.ref }}

  notifier:
    needs: gate
    if: needs.gate.outputs.build == 'true'
    uses: ./.github/workflows/_build-image.yml
    with:
      image: notifier
      context: ./services
      dockerfile: services/notifier/Dockerfile
      ref: ${{ needs.gate.outputs.ref }}

  deploy:
    needs: [gate, web, core-api, media-worker, notifier]
    # always(): deploy-only пропускает сборку, но при упавшей сборке деплоить нельзя.
    if: always() && needs.gate.result == 'success' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.ref }}

      - uses: azure/setup-kubectl@v4
        with: { version: v1.36.1 }

      # Тег sha-<short> вычисляется так же, как в _build-image.yml. Образы с неизменяемым тегом
      # (а не latest) дают kubelet повод перезапустить поды и позволяют откатиться `rollout undo`.
      - name: Render manifests
        id: render
        run: |
          tag="sha-$(git rev-parse --short=7 HEAD)"
          infra/k8s/render.sh "$tag" > infra/k8s/tutorcraft.rendered.yaml
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # Схемные ошибки ловим на раннере, а не на сервере с работающим продом. На сервере
      # apply.sh дополнительно делает dry-run=server.
      - name: Validate manifests
        run: |
          docker run --rm -i ghcr.io/yannh/kubeconform:v0.6.7 -strict -summary - < infra/k8s/tutorcraft.rendered.yaml

      # В режиме deploy-only сборки не было: тег этого коммита мог не попасть в GHCR, и поды
      # повисли бы в ImagePullBackOff. Проверяем заранее.
      - uses: docker/login-action@v3
        if: needs.gate.outputs.build != 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check images exist
        if: needs.gate.outputs.build != 'true'
        run: |
          for image in web core-api media-worker notifier; do
            ref="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/tutorcraft-${image}:${{ steps.render.outputs.tag }}"
            docker buildx imagetools inspect "$ref" >/dev/null || { echo "нет образа $ref: запустите Deploy с target=all"; exit 1; }
          done

      # Манифест и скрипты всегда льём из репозитория: иначе правки лимитов и образов не доезжают
      # до сервера без ручного git pull.
      - name: Sync deploy files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          # nginx-конфиги — справочно, чтобы правки vhost доезжали до сервера вместе с релизом
          # (ставятся в /etc/nginx вручную, см. docs/deployment-ip.md).
          source: "infra/k8s/tutorcraft.rendered.yaml,infra/k8s/apply.sh,infra/deploy/backup.sh,infra/deploy/nginx/tutorcraft-ip.conf,infra/deploy/nginx/tutorcraft-proxy.conf"
          target: ${{ secrets.PROD_PATH }}
          overwrite: true

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_PULL_USER: ${{ secrets.GHCR_PULL_USER }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          envs: GHCR_PULL_USER,GHCR_PULL_TOKEN
          # Хранилища (до 5 мин) + kafka-init (до 5 мин) + core-api (до 10 мин) + остальные.
          command_timeout: 30m
          script: |
            set -e
            cd "${{ secrets.PROD_PATH }}"
            chmod +x infra/k8s/apply.sh infra/deploy/backup.sh
            infra/k8s/apply.sh
