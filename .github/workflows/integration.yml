# Интеграционные тесты core-api (*IT.java, @Tag("integration")) на Testcontainers.
#
# Вынесены из ci.yml, потому что deploy-production гейтится успехом `ci`: эти тесты поднимают
# Postgres, MongoDB, Redis и Kafka в контейнерах и зависят от версии докера на раннере — им не
# место на пути выкладки уже проверенного кода. Та же логика, что и у e2e.yml.
#
# Testcontainers 1.21.4 (см. pom.xml): 1.20.3 не умела договариваться о версии API с Docker
# Engine 29 и падала с 400 на /info ещё до старта контейнеров.
#
# Запускать обязательно перед релизом и после правок в репозиториях, SQL и миграциях.
name: integration

on:
  workflow_dispatch:
  schedule:
    # 03:45 UTC — после ночного e2e (03:15), чтобы два тяжёлых прогона не делили раннер.
    - cron: '45 3 * * *'

permissions:
  contents: read

jobs:
  core-api-it:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults: { run: { working-directory: services/core-api } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }

      # Образы тянем заранее: иначе Testcontainers качает их внутри первого теста, и долгая
      # загрузка mongo:7 роняет прогон по таймауту сокета, а не по существу.
      - name: Pre-pull test images
        run: |
          for image in postgres:16-alpine mongo:7 redis:7-alpine apache/kafka:3.8.0; do
            docker pull -q "$image"
          done

      # test-compile, а не verify: юнит-тесты уже прогнал `ci`, здесь нужны только собранные
      # тестовые классы и сами IT. `mvn verify` прогнал бы и surefire вторым заходом.
      - name: Integration tests (Testcontainers)
        run: mvn -B test-compile failsafe:integration-test failsafe:verify

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failsafe-reports
          path: services/core-api/target/failsafe-reports/
          if-no-files-found: ignore
