# TutorCraft — vhost для доступа по голому IP (без домена, без TLS).
#
#   посетитель → http://91.149.179.186        → 127.0.0.1:3100 (Next.js)
#                http://91.149.179.186/ws     → 127.0.0.1:8190 (notifier, WebSocket)
#                http://91.149.179.186/storage/ → 127.0.0.1:3180 (core-api: файлы, STORAGE_DRIVER=local)
#
# /api/v1/* НЕ проксируем в core-api напрямую: это делает BFF-роут Next.js (ADR-003, same-origin
# refresh-cookie). Исключение — /storage/: подписанные ссылки на файлы (загрузка до 2 ГиБ, видео,
# HLS) идут в core-api мимо Node, иначе упёрлись бы в лимиты и таймауты BFF. Контейнеры публикуют
# порты только на 127.0.0.1 — мимо этого nginx не пройти.
#
# Пока файлы лежат на диске сервера, отдельный S3-шлюз на :9000 не нужен. При переезде на внешний
# S3 браузер ходит к провайдеру напрямую, при возврате SeaweedFS — см. историю этого файла.
#
# ⚠ Сервер общий с confeek. Здесь НЕТ `default_server` и НЕТ `listen [::]`: точное совпадение
# server_name с IP всё равно выигрывает у чужого default_server, а лишний listen-параметр
# nginx применил бы к общему сокету и сломал бы соседа. Перед reload обязателен `nginx -t`.
#
# Установка (от root):
#   cp tutorcraft-ip.conf /etc/nginx/sites-available/tutorcraft.conf
#   ln -s /etc/nginx/sites-available/tutorcraft.conf /etc/nginx/sites-enabled/tutorcraft.conf
#   nginx -t && systemctl reload nginx
# Если на сервере нет sites-enabled — класть в /etc/nginx/conf.d/tutorcraft.conf.

# --- Зоны лимитов. Имена с префиксом tc_ — у confeek могут быть свои зоны, коллизия имён
# --- уронила бы весь nginx. 10m ≈ 160 000 адресов.
limit_req_zone  $binary_remote_addr zone=tc_general:10m rate=40r/s;
limit_req_zone  $binary_remote_addr zone=tc_login:10m   rate=12r/m;
limit_req_zone  $binary_remote_addr zone=tc_api:10m     rate=10r/s;
limit_conn_zone $binary_remote_addr zone=tc_conn:10m;

# limit_req_status / limit_conn_status задаются ВНУТРИ server-блоков, а не здесь: в http-контексте
# каждая из них допустима лишь один раз, и если confeek уже объявил свою — nginx -t упал бы с
# «directive is duplicate», заблокировав reload для обоих сайтов.

upstream tutorcraft_web {
    server 127.0.0.1:3100;
    keepalive 32;
}

upstream tutorcraft_ws {
    server 127.0.0.1:8190;
}

upstream tutorcraft_core {
    server 127.0.0.1:3180;
    keepalive 16;
}

map $http_upgrade $tutorcraft_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name 91.149.179.186;

    server_tokens off;

    # Через приложение идут JSON и multipart ≤ 20 МБ (лимит core-api). Файлы и видео идут через
    # location /storage/ ниже, у него свой лимит.
    client_max_body_size 25m;

    # Slowloris: медленный клиент не должен занимать воркер.
    client_body_timeout   20s;
    client_header_timeout 20s;
    send_timeout          30s;
    keepalive_timeout     30s;

    # 429 вместо дефолтного 503: клиент и мониторинг различают «перегружен» и «ты долбишь».
    limit_req_status  429;
    limit_conn_status 429;
    limit_conn tc_conn 60;
    limit_req  zone=tc_general burst=80 nodelay;

    access_log /var/log/nginx/tutorcraft.access.log;
    error_log  /var/log/nginx/tutorcraft.error.log warn;

    # --- Закрытая поверхность ---------------------------------------------------------------
    # Спецификация API и Swagger: выключены в application-prod.yml, здесь — второй рубеж.
    location = /api/v1/openapi.json { return 404; }
    location ^~ /api/docs          { return 404; }
    location ^~ /actuator          { return 404; }

    # Массовое сканирование: .env, .git, дампы, чужие CMS. 444 = закрыть соединение молча,
    # не тратя ответ на бота.
    location ~* /\.(env|git|svn|hg|aws|ssh)(/|$) { return 444; }
    location ~* \.(sql|bak|old|swp|log|ini|conf|pem|key)$ { return 444; }
    location ~* ^/(wp-admin|wp-login|wordpress|xmlrpc|phpmyadmin|pma|adminer|vendor/phpunit) { return 444; }
    location ~* \.(php|asp|aspx|jsp|cgi)$ { return 444; }

    # --- Брутфорс входа ---------------------------------------------------------------------
    # Дополняет (не заменяет) троттлинг в core-api по email+IP: тот считает в Redis, этот
    # отсекает поток до приложения. /auth/refresh сюда не попадает — он вызывается часто
    # и штатно (silent refresh), у него общий лимит tc_api.
    location ~ ^/api/v1/auth/(login|register|password/(forgot|reset)|oauth/(google|telegram)|invitations/accept)$ {
        limit_req zone=tc_login burst=8 nodelay;
        limit_conn tc_conn 20;
        proxy_pass http://tutorcraft_web;
        include /etc/nginx/snippets/tutorcraft-proxy.conf;
    }

    # Префикс без `^~`: иначе он «съел» бы и /api/v1/auth/login, а regex-локация
    # с брутфорс-лимитом выше никогда бы не сработала (nginx при `^~` не проверяет regex).
    location /api/v1/ {
        limit_req zone=tc_api burst=40 nodelay;
        proxy_pass http://tutorcraft_web;
        include /etc/nginx/snippets/tutorcraft-proxy.conf;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # --- Файлы (локальное хранилище core-api) ----------------------------------------------
    # `^~`: regex-локации сканеров выше не должны перехватывать ключи объектов. Доступ — только по
    # подписи ссылки (проверяет core-api), кроме публичных плейлистов/сегментов hls/.
    location ^~ /storage/ {
        # Оригиналы видео — до 2 ГиБ (tutorcraft.storage.max-file-size-bytes).
        client_max_body_size 2100m;
        client_body_timeout 60s;
        send_timeout 300s;
        proxy_request_buffering off;
        proxy_buffering off;
        limit_conn tc_conn 40;
        limit_req zone=tc_general burst=80 nodelay;
        proxy_pass http://tutorcraft_core;
        include /etc/nginx/snippets/tutorcraft-proxy.conf;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # --- WebSocket --------------------------------------------------------------------------
    location = /ws {
        proxy_pass http://tutorcraft_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $tutorcraft_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # --- Приложение -------------------------------------------------------------------------
    location / {
        proxy_pass http://tutorcraft_web;
        include /etc/nginx/snippets/tutorcraft-proxy.conf;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
