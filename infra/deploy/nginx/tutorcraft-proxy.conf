# Общие proxy-заголовки для всех location'ов TutorCraft.
# Ставится в /etc/nginx/snippets/tutorcraft-proxy.conf (см. tutorcraft-ip.conf).

proxy_http_version 1.1;
# Пустой Connection включает keepalive к upstream'у (см. `keepalive 32` в upstream-блоке).
proxy_set_header Connection "";
proxy_set_header Host $host;

# Ровно один адрес, а не $proxy_add_x_forwarded_for. core-api (Tomcat RemoteIpValve) берёт
# из цепочки последний недоверенный адрес; если пропустить присланный клиентом заголовок
# дальше, злоумышленник подставит любой IP и обойдёт троттлинг входа по адресу.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Real-IP $remote_addr;
