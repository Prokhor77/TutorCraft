# TutorCraft — vhost для домена с сертификатом Let's Encrypt (certbot) прямо на host-nginx, без Cloudflare.
# Текущий прод: https://tutorcraft.sproogeekdev.tech на 91.149.179.186.
#
#   https://<домен>/          → 10.43.0.100:3000 (web, Next.js)
#   https://<домен>/ws        → 10.43.0.101:8090 (notifier, WebSocket)
#   https://<домен>/storage/  → 10.43.0.102:8080 (core-api: файлы, STORAGE_DRIVER=local)
#   http://<домен>, http://91.149.179.186 → 301 на https://<домен>
#
# Адреса — закреплённые ClusterIP сервисов k3s (infra/k8s/app/*.yaml), с хоста доступны, из интернета нет.
# Защита (лимиты, сканеры, закрытые /actuator и /api/docs) — та же, что в tutorcraft-ip.conf.
#
# Установка (от root), заменив домен, если он другой:
#   cp tutorcraft-proxy.conf /etc/nginx/snippets/tutorcraft-proxy.conf
#   cp tutorcraft-domain-le.conf /etc/nginx/sites-available/tutorcraft.conf
#   ln -sfn /etc/nginx/sites-available/tutorcraft.conf /etc/nginx/sites-enabled/tutorcraft.conf
#   nginx -t && systemctl reload nginx
#
# ⚠ Сервер общий с confeek и crm: нет `default_server` и `listen [::]`, параметры `listen 443`
# должны совпадать с соседями (`nginx -T | grep 'listen.*443'`). Перед reload обязателен `nginx -t`.

limit_req_zone  $binary_remote_addr zone=tc_general:10m rate=40r/s;
limit_req_zone  $binary_remote_addr zone=tc_login:10m   rate=12r/m;
limit_req_zone  $binary_remote_addr zone=tc_api:10m     rate=10r/s;
limit_conn_zone $binary_remote_addr zone=tc_conn:10m;

upstream tutorcraft_web {
    server 10.43.0.100:3000;
    keepalive 32;
}

upstream tutorcraft_ws {
    server 10.43.0.101:8090;
}

upstream tutorcraft_core {
    server 10.43.0.102:8080;
    keepalive 16;
}

map $http_upgrade $tutorcraft_connection_upgrade {
    default upgrade;
    ''      close;
}

# HTTP: продление сертификата (certbot webroot) и редирект на HTTPS.
server {
    listen 80;
    server_name tutorcraft.sproogeekdev.tech;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://tutorcraft.sproogeekdev.tech$request_uri;
    }
}

# Голый IP — только редирект: один канонический адрес нужен и для SEO, и для cookie/WEB_ORIGIN.
server {
    listen 80;
    server_name 91.149.179.186;
    server_tokens off;
    return 301 https://tutorcraft.sproogeekdev.tech$request_uri;
}

server {
    listen 443 ssl;
    server_name tutorcraft.sproogeekdev.tech;

    ssl_certificate     /etc/letsencrypt/live/tutorcraft.sproogeekdev.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tutorcraft.sproogeekdev.tech/privkey.pem;

    server_tokens off;

    client_max_body_size 25m;
    client_body_timeout   20s;
    client_header_timeout 20s;
    send_timeout          30s;
    keepalive_timeout     30s;

    limit_req_status  429;
    limit_conn_status 429;
    limit_conn tc_conn 60;
    limit_req  zone=tc_general burst=80 nodelay;

    access_log /var/log/nginx/tutorcraft.access.log;
    error_log  /var/log/nginx/tutorcraft.error.log warn;

    # --- Закрытая поверхность ---------------------------------------------------------------
    location = /api/v1/openapi.json { return 404; }
    location ^~ /api/docs          { return 404; }
    location ^~ /actuator          { return 404; }

    location ~* /\.(env|git|svn|hg|aws|ssh)(/|$) { return 444; }
    location ~* \.(sql|bak|old|swp|log|ini|conf|pem|key)$ { return 444; }
    location ~* ^/(wp-admin|wp-login|wordpress|xmlrpc|phpmyadmin|pma|adminer|vendor/phpunit) { return 444; }
    location ~* \.(php|asp|aspx|jsp|cgi)$ { return 444; }

    # --- Брутфорс входа (см. комментарии в tutorcraft-ip.conf) ------------------------------
    location ~ ^/api/v1/auth/(login|register|password/(forgot|reset)|oauth/(google|telegram)|invitations/accept)$ {
        limit_req zone=tc_login burst=8 nodelay;
        limit_conn tc_conn 20;
        proxy_pass http://tutorcraft_web;
        include /etc/nginx/snippets/tutorcraft-proxy.conf;
    }

    location /api/v1/ {
        limit_req zone=tc_api burst=40 nodelay;
        proxy_pass http://tutorcraft_web;
        include /etc/nginx/snippets/tutorcraft-proxy.conf;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # --- Файлы (локальное хранилище core-api) ----------------------------------------------
    location ^~ /storage/ {
        client_max_body_size 2100m;
        client_body_timeout 60s;
        send_timeout 300s;
        proxy_request_buffering off;
        proxy_buffering off;
        limit_conn tc_conn 40;
        limit_req zone=tc_general burst=80 nodelay;
        add_header X-Robots-Tag "noindex, nofollow, noimageindex" always;
        proxy_pass http://tutorcraft_core;
        include /etc/nginx/snippets/tutorcraft-proxy.conf;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # --- WebSocket --------------------------------------------------------------------------
    location = /ws {
        proxy_pass http://tutorcraft_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $tutorcraft_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # --- Приложение -------------------------------------------------------------------------
    location / {
        proxy_pass http://tutorcraft_web;
        include /etc/nginx/snippets/tutorcraft-proxy.conf;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
