# TutorCraft — vhost для host-nginx на общем сервере с confeek.
#
# Путь запроса:  посетитель → Cloudflare → host-nginx (этот файл) → 127.0.0.1:3100 (Next.js)
#                                                                 └→ 127.0.0.1:8190 (/ws, notifier)
# /api/v1/* НЕ проксируем в core-api напрямую: это делает BFF-роут Next.js (ADR-003, same-origin
# refresh-cookie). Порты 3100/8190 опубликованы контейнерами только на 127.0.0.1
# (docker-compose.prod.yml), поэтому мимо Cloudflare/этого nginx к приложению не попасть.
#
# Установка (от root), предварительно заменив tutorcraft.example на реальный домен:
#   sed -i 's/tutorcraft\.example/ваш-домен/g' tutorcraft.conf cloudflare-realip.conf
#   cp cloudflare-realip.conf /etc/nginx/snippets/tutorcraft-cloudflare-realip.conf
#   cp tutorcraft.conf /etc/nginx/sites-available/tutorcraft.conf
#   ln -s /etc/nginx/sites-available/tutorcraft.conf /etc/nginx/sites-enabled/tutorcraft.conf
#   nginx -t && systemctl reload nginx
# Если на сервере нет sites-enabled (только conf.d) — класть в /etc/nginx/conf.d/tutorcraft.conf.
# `nginx -t` обязателен: сломанный конфиг уронит и confeek.
#
# TLS: сертификат делается так же, как для confeek.com (`nginx -T | grep ssl_certificate` покажет,
# certbot это или Cloudflare Origin CA). Пути ниже — плейсхолдеры.

upstream tutorcraft_web {
    server 127.0.0.1:3100;
    keepalive 32;
}

upstream tutorcraft_ws {
    server 127.0.0.1:8190;
}

map $http_upgrade $tutorcraft_connection_upgrade {
    default upgrade;
    ''      close;
}

# Параметры `listen 443` должны совпадать с блоком confeek 1:1 (`nginx -T | grep 'listen.*443'`):
# сокет у сайтов общий, и лишний параметр (например http2) nginx молча применит и к confeek —
# с предупреждением "protocol options redefined". Cloudflare ходит на origin по HTTP/1.1,
# так что http2 здесь ничего не даёт.
#
# IPv6-listen не добавляем: за Cloudflare origin достаточно A-записи, а `listen [::]` на хосте
# без IPv6 валит `nginx -t` — вместе с confeek.

server {
    listen 80;
    server_name tutorcraft.example www.tutorcraft.example;

    # HTTP-01 для certbot (если сертификат выпускается им, а не Cloudflare Origin CA).
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://tutorcraft.example$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name www.tutorcraft.example;

    ssl_certificate     /etc/nginx/ssl/tutorcraft.example.pem;
    ssl_certificate_key /etc/nginx/ssl/tutorcraft.example.key;

    return 301 https://tutorcraft.example$request_uri;
}

server {
    listen 443 ssl;
    server_name tutorcraft.example;

    ssl_certificate     /etc/nginx/ssl/tutorcraft.example.pem;
    ssl_certificate_key /etc/nginx/ssl/tutorcraft.example.key;

    server_tokens off;

    # Реальный IP посетителя из CF-Connecting-IP — без этого core-api видит адрес Cloudflare
    # и считает rate-limit/троттлинг входа на всех посетителей разом.
    include /etc/nginx/snippets/tutorcraft-cloudflare-realip.conf;

    # Через приложение идут только JSON и multipart ≤ 20 МБ (core-api); файлы и видео браузер
    # льёт напрямую в S3 по pre-signed URL, поэтому большой лимит здесь не нужен.
    client_max_body_size 25m;

    access_log /var/log/nginx/tutorcraft.access.log;
    error_log  /var/log/nginx/tutorcraft.error.log warn;

    location = /ws {
        proxy_pass http://tutorcraft_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $tutorcraft_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://tutorcraft_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # Ровно один адрес, а не $proxy_add_x_forwarded_for: цепочка уже свёрнута realip-модулем,
        # а core-api (Tomcat RemoteIpValve) берёт последний недоверенный адрес из списка.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
