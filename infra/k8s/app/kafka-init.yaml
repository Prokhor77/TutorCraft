# Идемпотентно создаёт топики из infra/kafka/create-topics.sh. Это тот же скрипт, что в dev-compose,
# kustomization.yaml кладёт его в ConfigMap.
#
# Spec Job неизменяем, поэтому infra/k8s/apply.sh удаляет старый Job перед каждым apply и ждёт
# завершения нового. Только после этого применяются приложения: auto-create топиков выключен.
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-init
  labels: { app.kubernetes.io/name: kafka-init, tutorcraft/tier: data }
spec:
  backoffLimit: 10
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels: { app.kubernetes.io/name: kafka-init, tutorcraft/tier: data }
    spec:
      restartPolicy: OnFailure
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext:
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: create-topics
          image: apache/kafka:3.8.0
          command: ["/bin/bash", "/scripts/create-topics.sh"]
          resources:
            requests: { cpu: 50m, memory: 256Mi }
            limits: { cpu: 500m, memory: 384Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: scripts, mountPath: /scripts, readOnly: true }
      volumes:
        - name: scripts
          configMap: { name: kafka-topics }
