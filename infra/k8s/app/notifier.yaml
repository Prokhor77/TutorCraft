# /ws для браузера: host-nginx → этот ClusterIP (см. core-api.yaml, почему закреплённый ClusterIP).
apiVersion: v1
kind: Service
metadata:
  name: notifier
  labels: { app.kubernetes.io/name: notifier, tutorcraft/tier: app }
spec:
  clusterIP: 10.43.0.101
  selector: { app.kubernetes.io/name: notifier }
  ports:
    - { name: http, port: 8090, targetPort: http }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notifier
  labels: { app.kubernetes.io/name: notifier, tutorcraft/tier: app }
spec:
  replicas: 1
  revisionHistoryLimit: 5
  # Под лёгкий (256 МБ), поэтому раскатка без простоя. Открытые WebSocket переподключатся к новому
  # поду. На время раскатки два консьюмера в одной группе — это штатный rebalance.
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: { app.kubernetes.io/name: notifier }
  template:
    metadata:
      labels: { app.kubernetes.io/name: notifier, tutorcraft/tier: app }
      annotations:
        tutorcraft/env-sha: "__ENV_SHA__"
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      imagePullSecrets: [{ name: ghcr }]
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        - name: wait-for-kafka
          image: busybox:1.37
          command: ["sh", "-c", "until nc -z -w 2 kafka 9092; do echo 'waiting for kafka'; sleep 3; done"]
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 100m, memory: 32Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
      containers:
        - name: notifier
          image: ghcr.io/prokhor77/tutorcraft-notifier:latest
          # Как env_file в compose: notifier нужны JWT_SECRET (WebSocket), SMTP_*, TELEGRAM_*,
          # WEB_ORIGIN, PUBLIC_BASE_URL.
          envFrom:
            - secretRef: { name: tutorcraft-env }
          env:
            - { name: KAFKA_BROKERS, value: "kafka:9092" }
          ports:
            - { name: http, containerPort: 8090 }
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
