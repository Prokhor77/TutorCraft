# Один брокер в режиме KRaft (broker + controller), как в compose.
# Headless-сервис: kafka:9092 резолвится прямо в под, и этот же адрес брокер анонсирует клиентам.
apiVersion: v1
kind: Service
metadata:
  name: kafka
  labels: { app.kubernetes.io/name: kafka, tutorcraft/tier: data }
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: { app.kubernetes.io/name: kafka }
  ports:
    - { name: kafka, port: 9092, targetPort: kafka }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  labels: { app.kubernetes.io/name: kafka, tutorcraft/tier: data }
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: kafka }
  template:
    metadata:
      labels: { app.kubernetes.io/name: kafka, tutorcraft/tier: data }
    spec:
      # Обязательно. Образ apache/kafka превращает каждую переменную KAFKA_* в свойство брокера,
      # а сервис с именем kafka через service links добавил бы KAFKA_PORT=tcp://10.43.…:9092 и
      # KAFKA_SERVICE_HOST. Брокер не стартовал бы с непонятной ошибкой конфига.
      enableServiceLinks: false
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        # Брокер работает от appuser, а каталог тома bootstrap создаёт от root. Делаем chown
        # тем же образом и по имени пользователя, чтобы не зашивать UID образа.
        - name: data-owner
          image: apache/kafka:3.8.0
          command:
            - sh
            - -c
            - '[ "$(stat -c %U /var/lib/kafka/data)" = appuser ] || chown -R appuser:appuser /var/lib/kafka/data'
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL], add: [CHOWN, DAC_OVERRIDE, FOWNER] }
          volumeMounts:
            - { name: data, mountPath: /var/lib/kafka/data }
      containers:
        - name: kafka
          image: apache/kafka:3.8.0
          env:
            - { name: KAFKA_NODE_ID, value: "1" }
            - { name: KAFKA_PROCESS_ROLES, value: "broker,controller" }
            - { name: KAFKA_LISTENERS, value: "PLAINTEXT://:9092,CONTROLLER://:9093" }
            - { name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://kafka:9092" }
            - { name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT" }
            - { name: KAFKA_CONTROLLER_LISTENER_NAMES, value: "CONTROLLER" }
            # Контроллер и брокер — один процесс, поэтому кворум на localhost, без DNS сервиса.
            - { name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@localhost:9093" }
            - { name: KAFKA_INTER_BROKER_LISTENER_NAME, value: "PLAINTEXT" }
            - { name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1" }
            - { name: KAFKA_AUTO_CREATE_TOPICS_ENABLE, value: "false" }
            - { name: KAFKA_NUM_PARTITIONS, value: "6" }
            - { name: KAFKA_LOG_RETENTION_HOURS, value: "168" }
            - { name: KAFKA_LOG_DIRS, value: "/var/lib/kafka/data" }
            - { name: KAFKA_HEAP_OPTS, value: "-Xms256m -Xmx512m" }
          ports:
            - { name: kafka, containerPort: 9092 }
          # TCP, а не kafka-broker-api-versions.sh: тот поднимает отдельную JVM (~200 МБ) на каждую
          # проверку, а память на этом сервере — главный дефицит.
          readinessProbe:
            tcpSocket: { port: kafka }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: kafka }
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            limits: { cpu: "1", memory: 768Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: data, mountPath: /var/lib/kafka/data }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: kafka-data }
