apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels: { app.kubernetes.io/name: postgres, tutorcraft/tier: data }
spec:
  selector: { app.kubernetes.io/name: postgres }
  ports:
    - { name: postgres, port: 5432, targetPort: postgres }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels: { app.kubernetes.io/name: postgres, tutorcraft/tier: data }
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: postgres }
  template:
    metadata:
      labels: { app.kubernetes.io/name: postgres, tutorcraft/tier: data }
    spec:
      # Без service links k8s добавил бы в окружение POSTGRES_PORT=tcp://10.43.…:5432 и подобные
      # переменные. Здесь это безвредно, но в kafka.yaml такие переменные ломают конфиг брокера,
      # поэтому service links выключены во всех манифестах.
      enableServiceLinks: false
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_DB
              valueFrom: { secretKeyRef: { name: tutorcraft-env, key: POSTGRES_DB } }
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: tutorcraft-env, key: POSTGRES_USER } }
            # Используется только при первой инициализации пустого каталога. Если сменить его
            # в .env позже, пароль в базе не изменится: нужен ALTER USER.
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: tutorcraft-env, key: POSTGRES_PASSWORD } }
          ports:
            - { name: postgres, containerPort: 5432 }
          readinessProbe:
            exec:
              command: ["sh", "-c", 'pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", 'pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 512Mi }
          # Entrypoint стартует от root, делает chown каталога данных и переходит в пользователя
          # postgres. Для этого нужны стандартные CHOWN/SETUID/SETGID, поэтому capabilities не
          # снимаем, а только запрещаем повышение привилегий (аналог no-new-privileges в compose).
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: postgres-data }
