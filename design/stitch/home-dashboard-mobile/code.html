<!DOCTYPE html>

<html lang="ru"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><meta content="mobile_blank" name="shell-type"/><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;700&amp;family=Work+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><style>@layer base{html,body{width:100vw;margin:0;padding:0;}body{overscroll-behavior:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config={darkMode:"class",theme:{extend:{colors:{"outline-variant":"#c7c4d7","outline":"#767586","surface-container-lowest":"#ffffff","primary-container":"#6063ee","on-primary-fixed":"#07006c","inverse-on-surface":"#eaf1ff","on-background":"#0b1c30","background":"#f8f9ff","on-secondary-container":"#00714d","primary":"#4648d4","tertiary-container":"#a36700","surface-container":"#e5eeff","secondary-container":"#6cf8bb","on-primary-container":"#fffbff","on-secondary-fixed-variant":"#005236","surface-tint":"#494bd6","inverse-primary":"#c0c1ff","on-tertiary-fixed":"#2a1700","tertiary-fixed":"#ffddb8","tertiary-fixed-dim":"#ffb95f","secondary-fixed-dim":"#4edea3","primary-fixed-dim":"#c0c1ff","on-surface":"#0b1c30","primary-fixed":"#e1e0ff","surface-container-highest":"#d3e4fe","on-primary-fixed-variant":"#2f2ebe","error-container":"#ffdad6","on-secondary-fixed":"#002113","secondary":"#006c49","on-tertiary-fixed-variant":"#653e00","error":"#ba1a1a","tertiary":"#825100","secondary-fixed":"#6ffbbe","on-tertiary":"#ffffff","inverse-surface":"#213145","on-secondary":"#ffffff","surface":"#f8f9ff","surface-bright":"#f8f9ff","on-error":"#ffffff","surface-container-low":"#eff4ff","surface-variant":"#d3e4fe","on-primary":"#ffffff","on-tertiary-container":"#fffbff","on-error-container":"#93000a","surface-container-high":"#dce9ff","on-surface-variant":"#464554","surface-dim":"#cbdbf5"},borderRadius:{DEFAULT:"1rem",lg:"2rem",xl:"3rem",full:"9999px"},spacing:{"space-sm":"0.5rem","space-md":"1rem",gutter:"1.25rem","space-xs":"0.25rem","space-xl":"2.25rem","space-lg":"1.5rem",margin:"1.75rem"},fontFamily:{"headline-xl":["Bricolage Grotesque"],"label-sm":["Work Sans"],"headline-lg":["Bricolage Grotesque"],"body-lg":["Work Sans"],"headline-lg-mobile":["Bricolage Grotesque"],"headline-md":["Bricolage Grotesque"],"body-md":["Work Sans"],"label-lg":["Work Sans"],"body-sm":["Work Sans"],"headline-xl-mobile":["Bricolage Grotesque"],"label-md":["Work Sans"],"headline-sm":["Bricolage Grotesque"]},fontSize:{"headline-xl":["40px",{lineHeight:"48px",letterSpacing:"-0.02em",fontWeight:"700"}],"label-sm":["10px",{lineHeight:"14px",letterSpacing:"0.04em",fontWeight:"600"}],"headline-lg":["32px",{lineHeight:"40px",letterSpacing:"-0.015em",fontWeight:"600"}],"body-lg":["16px",{lineHeight:"26px",fontWeight:"400"}],"headline-lg-mobile":["24px",{lineHeight:"32px",letterSpacing:"-0.01em",fontWeight:"600"}],"headline-md":["22px",{lineHeight:"28px",letterSpacing:"-0.01em",fontWeight:"600"}],"body-md":["14px",{lineHeight:"22px",fontWeight:"400"}],"label-lg":["14px",{lineHeight:"20px",fontWeight:"600"}],"body-sm":["12px",{lineHeight:"18px",fontWeight:"400"}],"headline-xl-mobile":["30px",{lineHeight:"38px",letterSpacing:"-0.015em",fontWeight:"700"}],"label-md":["12px",{lineHeight:"16px",letterSpacing:"0.02em",fontWeight:"600"}],"headline-sm":["18px",{lineHeight:"24px",fontWeight:"600"}]}}}};</script></head><body class="bg-surface font-body-md text-body-md text-on-surface flex flex-col min-h-screen pt-safe pb-safe"><main class="flex flex-col relative w-full bg-surface min-h-screen"><div class="flex flex-col w-full px-gutter pb-space-xl">
<!-- Subtle decorative ambient blobs -->
<div class="relative w-full flex flex-col items-center">
<div class="absolute -top-12 -left-10 w-44 h-44 rounded-full bg-primary-fixed blur-3xl opacity-60 pointer-events-none"></div>
<div class="absolute top-24 -right-12 w-48 h-48 rounded-full bg-secondary-fixed blur-3xl opacity-40 pointer-events-none"></div>
<!-- Header & Brand block -->
<div class="flex flex-col items-center text-center mt-space-md mb-space-lg relative z-10">
<div class="relative mb-space-sm group">
<div class="w-20 h-20 rounded-full p-1 bg-surface-container-lowest shadow-md flex items-center justify-center transform transition-transform duration-300 group-hover:scale-105">
<img alt="TutorCraft Studio Logo" class="w-full h-full rounded-full object-cover" src="https://lh3.googleusercontent.com/aida/AEtjO1WAEbyTEBSxJJcLn60YZgoynztUa8n418DNva0GRNdhmBdjI52Q9UdDVe3vVV35RxVO2_8CViNBaw3Vf6VTDX12zrXvvIOWiPmYAkRsb5Eh3LfhFh8cA5SuKH6OrXW_O9-3BIgZsHfkHW2GolhhGE1_DfSb0lL0CDTyCf1dXPVa6HTTnFmnQTYtBAc7NVpf_vklhz0l3VPuMO9XNna2dd9SNv7Ttzp9LqRw6XSnUxUSletEeNXRriVKEw"/>
</div>
<div class="absolute -bottom-1 -right-1 w-6 h-6 rounded-full bg-secondary text-on-secondary flex items-center justify-center shadow-sm">
<span class="material-symbols-outlined text-xs" style="font-variation-settings: 'FILL' 1;">auto_awesome</span>
</div>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface tracking-tight">TutorCraft Studio</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant max-w-[280px] mt-space-xs">Мобильный кабинет репетитора и автора курсов</p>
</div>
<!-- Main Card Container -->
<div class="w-full bg-surface-container-lowest rounded-lg p-space-lg shadow-sm relative z-10 flex flex-col gap-space-lg">
<!-- Segmented Tab Switcher -->
<div class="w-full bg-surface-container-low p-space-xs rounded-full flex items-center relative" id="authTabs">
<button class="flex-1 py-space-xs rounded-full font-label-md text-label-md transition-all duration-200 bg-surface-container-lowest text-primary shadow-sm text-center" id="tabLogin" onclick="switchAuthTab('login')" type="button">
          Вход
        </button>
<button class="flex-1 py-space-xs rounded-full font-label-md text-label-md transition-all duration-200 text-on-surface-variant hover:text-on-surface text-center" id="tabRegister" onclick="switchAuthTab('register')" type="button">
          Регистрация
        </button>
</div>
<!-- Auth Form -->
<form class="flex flex-col gap-space-md" onsubmit="event.preventDefault(); triggerAuth();">
<!-- Input: Email / Phone -->
<div class="flex flex-col gap-space-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider ml-1" id="loginFieldLabel">Телефон или Email</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-space-md text-outline-variant pointer-events-none transition-colors duration-200 group-focus-within:text-primary">
              alternate_email
            </span>
<input class="w-full pl-11 pr-space-md py-space-sm bg-surface-container-low rounded-DEFAULT font-body-md text-body-md text-on-surface placeholder:text-outline-variant focus:outline-none focus:bg-surface-container-lowest focus:shadow-[0_0_0_2px_#6063ee] transition-all duration-200" id="userCredential" placeholder="учитель@tutorcraft.ru или +7 (900)..." required="" type="text"/>
</div>
</div>
<!-- Input: Password -->
<div class="flex flex-col gap-space-xs">
<div class="flex justify-between items-center ml-1">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">Пароль</label>
<a class="font-label-md text-label-md text-primary hover:text-on-primary-fixed-variant transition-colors duration-150" href="javascript:void(0)">Забыли пароль?</a>
</div>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-space-md text-outline-variant pointer-events-none">
              lock
            </span>
<input class="w-full pl-11 pr-11 py-space-sm bg-surface-container-low rounded-DEFAULT font-body-md text-body-md text-on-surface placeholder:text-outline-variant focus:outline-none focus:bg-surface-container-lowest focus:shadow-[0_0_0_2px_#6063ee] transition-all duration-200" id="userPassword" placeholder="••••••••••••" required="" type="password"/>
<button aria-label="Показать или скрыть пароль" class="absolute right-space-sm p-space-xs text-outline-variant hover:text-on-surface focus:outline-none transition-colors duration-150" onclick="togglePasswordVisibility()" type="button">
<span class="material-symbols-outlined text-lg" id="passwordIcon">visibility_off</span>
</button>
</div>
</div>
<!-- Checkbox: Remember me -->
<div class="flex items-center justify-between pt-space-xs">
<label class="flex items-center gap-space-sm cursor-pointer select-none">
<input checked="" class="sr-only peer" id="rememberMeCheckbox" type="checkbox"/>
<div class="w-5 h-5 rounded-md bg-surface-container-low peer-checked:bg-primary flex items-center justify-center text-on-primary transition-colors duration-200">
<span class="material-symbols-outlined text-sm">check</span>
</div>
<span class="font-body-sm text-body-sm text-on-surface-variant">Запомнить меня на этом устройстве</span>
</label>
</div>
<!-- Primary Action Button -->
<button class="w-full mt-space-xs py-space-md px-space-lg rounded-full bg-primary text-on-primary font-label-lg text-label-lg flex items-center justify-center gap-space-sm shadow-md active:scale-95 transition-all duration-150 hover:bg-primary-container" id="submitBtn" type="submit">
<span id="submitBtnText">Войти в студию</span>
<span class="material-symbols-outlined text-lg transition-transform duration-200 group-hover:translate-x-1">arrow_forward</span>
</button>
</form>
<!-- Biometric Quick Auth Pill Button -->
<button class="w-full py-space-sm px-space-md rounded-full bg-surface-container-low hover:bg-surface-container text-on-surface-variant flex items-center justify-center gap-space-sm transition-colors duration-150" onclick="triggerBiometrics()" type="button">
<span class="material-symbols-outlined text-primary text-xl" style="font-variation-settings: 'FILL' 1;">fingerprint</span>
<span class="font-label-md text-label-md">Быстрый вход по Face ID / отпечатку</span>
</button>
<!-- Divider -->
<div class="relative flex items-center justify-center my-space-xs">
<div class="w-full h-px bg-surface-container-high"></div>
<span class="absolute bg-surface-container-lowest px-space-md font-body-sm text-body-sm text-outline">или войти через</span>
</div>
<!-- Social Logins Grid -->
<div class="grid grid-cols-2 gap-space-sm">
<!-- Госуслуги -->
<button class="flex items-center gap-space-sm p-space-sm rounded-DEFAULT bg-surface-container-low hover:bg-surface-container active:scale-98 transition-all duration-150 text-left" type="button">
<div class="w-8 h-8 rounded-full bg-[#0d4cd3] text-[#ffffff] flex items-center justify-center flex-shrink-0 font-headline-sm text-xs font-bold">
            ГУ
          </div>
<div class="min-w-0 flex flex-col">
<span class="font-label-md text-label-md text-on-surface truncate">Госуслуги</span>
<span class="font-label-sm text-label-sm text-outline truncate">ЕСИА ключ</span>
</div>
</button>
<!-- VK ID -->
<button class="flex items-center gap-space-sm p-space-sm rounded-DEFAULT bg-surface-container-low hover:bg-surface-container active:scale-98 transition-all duration-150 text-left" type="button">
<div class="w-8 h-8 rounded-full bg-[#0077ff] text-[#ffffff] flex items-center justify-center flex-shrink-0 font-headline-sm text-xs font-bold">
            VK
          </div>
<div class="min-w-0 flex flex-col">
<span class="font-label-md text-label-md text-on-surface truncate">VK ID</span>
<span class="font-label-sm text-label-sm text-outline truncate">Профиль</span>
</div>
</button>
<!-- Яндекс ID -->
<button class="flex items-center gap-space-sm p-space-sm rounded-DEFAULT bg-surface-container-low hover:bg-surface-container active:scale-98 transition-all duration-150 text-left" type="button">
<div class="w-8 h-8 rounded-full bg-[#fc3f1d] text-[#ffffff] flex items-center justify-center flex-shrink-0 font-headline-sm text-xs font-bold">
            Я
          </div>
<div class="min-w-0 flex flex-col">
<span class="font-label-md text-label-md text-on-surface truncate">Яндекс ID</span>
<span class="font-label-sm text-label-sm text-outline truncate">Паспорт</span>
</div>
</button>
<!-- Telegram -->
<button class="flex items-center gap-space-sm p-space-sm rounded-DEFAULT bg-surface-container-low hover:bg-surface-container active:scale-98 transition-all duration-150 text-left" type="button">
<div class="w-8 h-8 rounded-full bg-[#2aabee] text-[#ffffff] flex items-center justify-center flex-shrink-0">
<span class="material-symbols-outlined text-sm">send</span>
</div>
<div class="min-w-0 flex flex-col">
<span class="font-label-md text-label-md text-on-surface truncate">Telegram</span>
<span class="font-label-sm text-label-sm text-outline truncate">Виджет</span>
</div>
</button>
</div>
</div>
<!-- Bottom Helper / Accreditation Callout -->
<div class="w-full mt-space-lg p-space-md rounded-lg bg-surface-container-low flex items-center gap-space-md relative z-10 shadow-sm">
<div class="w-10 h-10 rounded-full bg-secondary-container text-on-secondary-container flex items-center justify-center flex-shrink-0">
<span class="material-symbols-outlined text-xl" style="font-variation-settings: 'FILL' 1;">workspace_premium</span>
</div>
<div class="flex flex-col min-w-0">
<span class="font-label-md text-label-md text-on-surface">Новый преподаватель?</span>
<a class="font-label-sm text-label-sm text-primary hover:text-on-primary-fixed-variant truncate inline-flex items-center gap-0.5" href="javascript:void(0)">
          Подать заявку на аккредитацию
          <span class="material-symbols-outlined text-xs">chevron_right</span>
</a>
</div>
</div>
<!-- Safe-area bottom reassurance note -->
<div class="mt-space-md text-center text-outline font-label-sm text-label-sm flex items-center justify-center gap-space-xs">
<span class="material-symbols-outlined text-xs text-secondary">verified_user</span>
<span>Шифрование данных по стандарту ГОСТ Р 34.12</span>
</div>
</div>
</div>
<script>
  function switchAuthTab(type) {
    const loginTab = document.getElementById('tabLogin');
    const registerTab = document.getElementById('tabRegister');
    const submitBtnText = document.getElementById('submitBtnText');
    const loginFieldLabel = document.getElementById('loginFieldLabel');

    if (type === 'register') {
      registerTab.className = "flex-1 py-space-xs rounded-full font-label-md text-label-md transition-all duration-200 bg-surface-container-lowest text-primary shadow-sm text-center";
      loginTab.className = "flex-1 py-space-xs rounded-full font-label-md text-label-md transition-all duration-200 text-on-surface-variant hover:text-on-surface text-center";
      submitBtnText.textContent = 'Создать кабинет автора';
      loginFieldLabel.textContent = 'Рабочий Email или Телефон';
    } else {
      loginTab.className = "flex-1 py-space-xs rounded-full font-label-md text-label-md transition-all duration-200 bg-surface-container-lowest text-primary shadow-sm text-center";
      registerTab.className = "flex-1 py-space-xs rounded-full font-label-md text-label-md transition-all duration-200 text-on-surface-variant hover:text-on-surface text-center";
      submitBtnText.textContent = 'Войти в студию';
      loginFieldLabel.textContent = 'Телефон или Email';
    }
  }

  function togglePasswordVisibility() {
    const pwd = document.getElementById('userPassword');
    const icon = document.getElementById('passwordIcon');
    if (pwd.type === 'password') {
      pwd.type = 'text';
      icon.textContent = 'visibility';
    } else {
      pwd.type = 'password';
      icon.textContent = 'visibility_off';
    }
  }

  function triggerBiometrics() {
    const btn = event.currentTarget;
    btn.classList.add('scale-95');
    setTimeout(() => {
      btn.classList.remove('scale-95');
      alert('Запрос Face ID / биометрии устройства...');
    }, 150);
  }

  function triggerAuth() {
    const btn = document.getElementById('submitBtn');
    btn.innerHTML = '<span class="material-symbols-outlined animate-spin text-lg">progress_activity</span><span>Подключение...</span>';
    setTimeout(() => {
      btn.innerHTML = '<span>Войти в студию</span><span class="material-symbols-outlined text-lg">arrow_forward</span>';
    }, 1200);
  }
</script></main></body></html>
